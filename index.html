<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NifeCode</title>
  </head>
  <body>
    <div id="app">
      <div id="titlebar">
        <button id="brand" title="主菜单">
          <svg viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">
            <rect x="5" y="5" width="22" height="22" fill="#452760" rx="2"/>
            <rect x="11" y="10" width="4" height="12" fill="#f0ecf8"/>
          </svg>
          <span class="nm">NifeCode</span>
        </button>
        <div class="drag"></div>
        <div id="winbtns">
          <button id="win-min" title="最小化"></button>
          <button id="win-max" title="最大化"></button>
          <button id="win-close" title="关闭"></button>
        </div>
      </div>

      <div id="ctxbar">
        <div id="ctx-tabs"></div>
      </div>

      <div id="activity">
        <button data-act="explorer" class="active" title="资源管理器"></button>
        <button data-act="search" title="搜索"></button>
        <button data-act="scm" title="源代码管理"></button>
        <button data-act="ssh" title="SSH 连接"></button>
      </div>

      <div id="sidebar">
        <div class="head" id="side-head">
          <span id="sidebar-title">资源管理器</span>
        </div>
        <div id="tree"></div>

        <div id="ssh-panel">
          <div class="ssh-head">
            <span>SSH 连接</span>
            <span class="spacer"></span>
            <button id="btn-ssh-new" title="新建连接">＋</button>
          </div>
          <div id="ssh-list"></div>
        </div>

        <div id="search-panel">
          <div class="search-head">
            <span>搜索</span>
            <span class="spacer"></span>
            <button id="se-fold" title="全部折叠">⊟</button>
            <button id="se-refresh" title="重新搜索">⟳</button>
            <button id="se-clear" title="清除搜索结果">✕</button>
            <button id="se-more" title="包含/排除文件">⋯</button>
          </div>
          <div class="search-box">
            <div class="se-row">
              <button id="se-repl-toggle" title="显示/隐藏替换框">▾</button>
              <div class="se-field">
                <input id="search-input" placeholder="搜索" />
                <span class="se-togs">
                  <button id="se-case" class="se-tog" title="区分大小写">Aa</button>
                  <button id="se-word" class="se-tog" title="全字匹配">ab</button>
                  <button id="se-regex" class="se-tog" title="使用正则表达式">.*</button>
                </span>
              </div>
            </div>
            <div id="se-scope" class="se-scope hidden">
              <span id="se-scope-text"></span>
              <button id="se-scope-clear" title="在整个工作区里搜">✕</button>
            </div>
            <div id="se-replace" class="se-row se-indent">
              <div class="se-field">
                <input id="replace-input" placeholder="替换" />
                <span class="se-togs">
                  <button id="se-preserve" class="se-tog" title="保留大小写替换">AB</button>
                </span>
              </div>
              <button id="replace-all" title="把当前搜索内容全部替换掉">全部替换</button>
            </div>
            <div id="se-files" class="se-files hidden">
              <div class="se-field">
                <input id="se-include" placeholder="文件包含（如 *.ts,src/**）" />
              </div>
              <div class="se-field">
                <input id="se-exclude" placeholder="文件排除（如 *.min.js,dist/**）" />
              </div>
            </div>
          </div>
          <div id="search-list"></div>
        </div>

        <div id="scm">
          <div class="scm-head">
            <select id="scm-repo" title="选择要管理的 git 仓库（工作区根目录或它下面的某个子文件夹）"></select>
            <span id="scm-branch">—</span>
            <span class="spacer"></span>
            <button id="scm-refresh" title="刷新">⟳</button>
          </div>
          <div class="scm-commit">
            <textarea id="scm-msg" placeholder="提交信息（Ctrl+Enter 提交）"></textarea>
            <div class="scm-btns">
              <button id="scm-do" title="提交暂存区里的更改">提交</button>
              <button id="scm-push" class="ghost" title="提交后推送到 remote">提交并推送</button>
              <button id="scm-pull" class="ghost" title="git pull --ff-only（只快进，不产生 merge 提交）">拉取</button>
            </div>
          </div>
          <div id="scm-list"></div>
        </div>
      </div>

      <div id="main">
        <div id="side-splitter"></div>
        <div id="tabbar">
          <div id="tabs"></div>
          <button id="tab-md" title="Markdown 实时预览（Ctrl+Shift+V）">预览</button>
        </div>
        <div id="editor"></div>
      </div>

      <div id="term-col">
        <div id="term-splitter"></div>
        <div class="head">
          <span>终端</span>
          <span class="spacer"></span>
          <button id="btn-new-term" title="新建终端页（独立的一组终端）">＋</button>
          <button id="btn-term-type" title="在当前终端页新建终端（选类型）">˅</button>
          <button id="btn-close-panel" title="收起终端栏">✕</button>
        </div>
        <div id="term-host"></div>
      </div>

      <div id="status">
        <span id="st-msg"></span>
        <span class="spacer"></span>
        <span id="st-enc" title="点击更换重新打开/保存用的编码"></span>
        <span id="st-md" title="Markdown 实时预览（Ctrl+Shift+V）">预览</span>
        <span id="st-ws" title="用这个文件里的 folders / settings 打开工作区">打开工作区</span>
        <span id="st-eol" title="换行符"></span>
        <span id="st-conn">本地</span>
        <span id="st-pos"></span>
        <span id="st-term" title="打开/收起终端栏（Ctrl+`）">终端</span>
        <span id="st-fwd" title="点击停止全部端口转发"></span>
        <span id="st-bridge" title="Agent Bridge 端口">bridge :7317</span>
      </div>
    </div>

    <div id="modal" class="hidden">
      <div class="box">
        <div class="title"></div>
        <div class="body"></div>
        <div class="actions"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <div id="ctxmenu" class="hidden"></div>
    <div id="tip" class="hidden"></div>
  </body>
</html>
