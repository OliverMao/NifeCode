[package]
name = "nifecode"
version = "0.1.10"
description = "轻量 VS Code 兼容编辑器（本地 + SSH + 终端 + Agent Bridge）"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/OliverMao/NifeCode"

[lib]
name = "nifecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
# 进程内读 git 状态：实测 0.8ms vs 每次 spawn git 37.8ms
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
tauri-plugin-clipboard-manager = "2.5.0"
encoding_rs = "0.8.44"
ignore = "0.4.34"

[profile.dev]
incremental = true

# 打包/纯 cargo release 构建需要它来内嵌前端资源（tauri build 会自动加）
[features]
custom-protocol = ["tauri/custom-protocol"]
